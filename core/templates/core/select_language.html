<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Language</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .flag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            margin: 2rem auto;
            max-width: 500px;
        }
        .flag-btn {
            background: #fff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: box-shadow 0.2s, border 0.2s;
        }
        .flag-btn:hover, .flag-btn:focus {
            border: 2px solid #2563eb;
            box-shadow: 0 2px 12px rgba(37,99,235,0.08);
        }
        .flag-img {
            width: 40px;
            height: 28px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }
        .flag-label {
            font-size: 1rem;
            color: #222;
            font-weight: 500;
        }
        .lang-active {
            border: 2px solid #22c55e;
            background: #f0fdf4;
        }
        @media (max-width: 600px) {
            .flag-grid { max-width: 98vw; gap: 1rem; }
            .flag-btn { padding: 0.7rem 0.2rem; }
        }
    </style>
    <!-- Google Translate widget -->
    <script type="text/javascript">
            function googleTranslateElementInit() {
                new google.translate.TranslateElement({
                    pageLanguage: 'en',
                    includedLanguages: 'en,fr,es,pt,ko,tr,ru,zh,zh-TW,ar,pl,it,ky,de,ja,hi,id,nl'
                }, 'google_translate_element');
            }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>
    <h1 style="text-align:center; margin-top:2rem;">Select Your Language</h1>
    <div id="google_translate_element" style="text-align:center; margin-bottom:2rem;"></div>
    <div class="flag-grid">
        <button class="flag-btn" data-lang="en">
            <img class="flag-img" src="https://flagcdn.com/48x36/gb.png" alt="English flag">
            <span class="flag-label">English</span>
        </button>
        <button class="flag-btn" data-lang="fr">
            <img class="flag-img" src="https://flagcdn.com/48x36/fr.png" alt="French flag">
            <span class="flag-label">Français</span>
        </button>
        <button class="flag-btn" data-lang="es">
            <img class="flag-img" src="https://flagcdn.com/48x36/es.png" alt="Spanish flag">
            <span class="flag-label">Español</span>
        </button>
        <button class="flag-btn" data-lang="pt">
            <img class="flag-img" src="https://flagcdn.com/48x36/pt.png" alt="Portuguese flag">
            <span class="flag-label">Português</span>
        </button>
        <button class="flag-btn" data-lang="de">
            <img class="flag-img" src="https://flagcdn.com/48x36/de.png" alt="German flag">
            <span class="flag-label">Deutsch</span>
        </button>
        <button class="flag-btn" data-lang="ja">
            <img class="flag-img" src="https://flagcdn.com/48x36/jp.png" alt="Japanese flag">
            <span class="flag-label">日本語</span>
        </button>
        <button class="flag-btn" data-lang="hi">
            <img class="flag-img" src="https://flagcdn.com/48x36/in.png" alt="Hindi flag">
            <span class="flag-label">हिन्दी</span>
        </button>
        <button class="flag-btn" data-lang="id">
            <img class="flag-img" src="https://flagcdn.com/48x36/id.png" alt="Indonesian flag">
            <span class="flag-label">Bahasa Indonesia</span>
        </button>
        <button class="flag-btn" data-lang="nl">
            <img class="flag-img" src="https://flagcdn.com/48x36/nl.png" alt="Dutch flag">
            <span class="flag-label">Nederlands</span>
        </button>
        <button class="flag-btn" data-lang="ko">
            <img class="flag-img" src="https://flagcdn.com/48x36/kr.png" alt="Korean flag">
            <span class="flag-label">한국어</span>
        </button>
        <button class="flag-btn" data-lang="tr">
            <img class="flag-img" src="https://flagcdn.com/48x36/tr.png" alt="Turkish flag">
            <span class="flag-label">Türkçe</span>
        </button>
        <button class="flag-btn" data-lang="ru">
            <img class="flag-img" src="https://flagcdn.com/48x36/ru.png" alt="Russian flag">
            <span class="flag-label">Русский</span>
        </button>
        <button class="flag-btn" data-lang="zh">
            <img class="flag-img" src="https://flagcdn.com/48x36/cn.png" alt="Chinese flag">
            <span class="flag-label">中文</span>
        </button>
        <button class="flag-btn" data-lang="zh-TW">
            <img class="flag-img" src="https://flagcdn.com/48x36/tw.png" alt="Taiwan flag">
            <span class="flag-label">繁體中文</span>
        </button>
        <button class="flag-btn" data-lang="ar">
            <img class="flag-img" src="https://flagcdn.com/48x36/sa.png" alt="Arabic flag">
            <span class="flag-label">العربية</span>
        </button>
        <button class="flag-btn" data-lang="pl">
            <img class="flag-img" src="https://flagcdn.com/48x36/pl.png" alt="Polish flag">
            <span class="flag-label">Polski</span>
        </button>
        <button class="flag-btn" data-lang="it">
            <img class="flag-img" src="https://flagcdn.com/48x36/it.png" alt="Italian flag">
            <span class="flag-label">Italiano</span>
        </button>
        <button class="flag-btn" data-lang="ky">
            <img class="flag-img" src="https://flagcdn.com/48x36/kg.png" alt="Kyrgyz flag">
            <span class="flag-label">Кыргызча</span>
        </button>
    </div>
    <script>
                // Helper to trigger Google Translate reliably
                function setGoogleTranslate(lang) {
                    var googleLang = langMap[lang] || 'en';
                    function trySet() {
                        var select = document.querySelector('select.goog-te-combo');
                        if (select) {
                            select.value = googleLang;
                            select.dispatchEvent(new Event('input', { bubbles: true }));
                            select.dispatchEvent(new Event('change', { bubbles: true }));
                            return true;
                        }
                        return false;
                    }
                    // Try immediately, then retry a few times if widget is not ready
                    if (!trySet()) {
                        var tries = 0;
                        var interval = setInterval(function() {
                            tries++;
                            if (trySet() || tries > 10) clearInterval(interval);
                        }, 300);
                    }
                }

                // Dropdown language select handler
                document.getElementById('manual-lang-select').addEventListener('change', function() {
                    var lang = this.value;
                    localStorage.setItem('lang', lang);
                    setGoogleTranslate(lang);
                    setTimeout(function() {
                        window.location.href = '/';
                    }, 400);
                });

                // On page load, sync dropdown with localStorage/lang
                document.addEventListener('DOMContentLoaded', function() {
                    var lang = localStorage.getItem('lang');
                    if (lang) {
                        var dropdown = document.getElementById('manual-lang-select');
                        if (dropdown) dropdown.value = lang;
                    }
                });
        // Map language codes to Google Translate dropdown values
        const langMap = {
            en: 'en',
            fr: 'fr',
            es: 'es',
            pt: 'pt',
            de: 'de',
            ja: 'ja',
            hi: 'hi',
            id: 'id',
            nl: 'nl',
            ko: 'ko',
            tr: 'tr',
            ru: 'ru',
            zh: 'zh-CN',
            'zh-TW': 'zh-TW',
            ar: 'ar',
            pl: 'pl',
            it: 'it',
            ky: 'ky'
        };

        // Ensure all 18 flag languages are present in includedLanguages and langMap
        // Flags: en, fr, es, pt, de, ja, hi, id, nl, ko, tr, ru, zh, zh-TW, ar, pl, it, ky
        // includedLanguages: en,fr,es,pt,de,ja,hi,id,nl,ko,tr,ru,zh,zh-TW,ar,pl,it,ky
        // langMap: all above
        };
        // Flag click sets language, triggers Google Translate, and redirects
        document.querySelectorAll('.flag-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                var lang = btn.getAttribute('data-lang');
                localStorage.setItem('lang', lang);
                setGoogleTranslate(lang);
                setTimeout(function() {
                    window.location.href = '/';
                }, 400);
            });
        });
    </script>
</body>
</html>
